{{ define "content" }}
<div class="grid gap-5" x-data="{ open: true }">
  <div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
    <div class="mb-4 flex items-center justify-between gap-3">
      <h2 class="font-semibold">Tambah order</h2>
      <button type="button" class="rounded-lg border border-slate-200 px-3 py-2 text-sm font-semibold" x-on:click="open = !open">Toggle form</button>
    </div>
    <form x-show="open" hx-post="/orders" hx-target="#orders-table" hx-swap="outerHTML" class="grid gap-4 md:grid-cols-2">
      <input name="order_number" placeholder="Nomor order auto jika kosong" class="rounded-lg border-slate-200 px-3 py-2 text-sm shadow-sm" />
      <select name="customer_id" required class="rounded-lg border-slate-200 px-3 py-2 text-sm shadow-sm">
        <option value="">Pilih customer</option>
        {{ range .Customers }}<option value="{{ .ID }}">{{ .Name }}</option>{{ end }}
      </select>
      <select name="status" required class="rounded-lg border-slate-200 px-3 py-2 text-sm shadow-sm">
        {{ range .Statuses }}<option value="{{ . }}">{{ . }}</option>{{ end }}
      </select>
      <input name="total_amount" type="number" min="0" step="0.01" placeholder="Total" class="rounded-lg border-slate-200 px-3 py-2 text-sm shadow-sm" />
      <textarea name="notes" placeholder="Catatan" class="rounded-lg border-slate-200 px-3 py-2 text-sm shadow-sm md:col-span-2"></textarea>
      <div class="md:col-span-2">
        <button class="rounded-lg bg-teal-600 px-4 py-2 text-sm font-semibold text-white hover:bg-teal-700">Simpan order</button>
      </div>
    </form>
  </div>
  <div class="rounded-xl border border-slate-200 bg-white shadow-sm">
    <div class="border-b border-slate-200 px-5 py-4">
      <h2 class="font-semibold">Data order</h2>
    </div>
    {{ template "orders-table" . }}
  </div>
  {{ template "modal-shell" . }}
</div>
{{ end }}
