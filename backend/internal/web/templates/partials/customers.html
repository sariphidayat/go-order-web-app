{{ define "customers-table" }}
<div id="customers-table" class="overflow-x-auto">
  <table class="min-w-full divide-y divide-slate-200">
    <thead class="bg-slate-50">
      <tr>
        <th class="px-5 py-3 text-left text-xs font-semibold uppercase text-slate-500">Nama</th>
        <th class="px-5 py-3 text-left text-xs font-semibold uppercase text-slate-500">Email</th>
        <th class="px-5 py-3 text-left text-xs font-semibold uppercase text-slate-500">Telepon</th>
        <th class="px-5 py-3 text-left text-xs font-semibold uppercase text-slate-500">Alamat</th>
        <th class="px-5 py-3 text-right text-xs font-semibold uppercase text-slate-500">Aksi</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-slate-200">
      {{ range .Customers }}
      <tr>
        <td class="px-5 py-3 text-sm font-medium">{{ .Name }}</td>
        <td class="px-5 py-3 text-sm text-slate-600">{{ .Email }}</td>
        <td class="px-5 py-3 text-sm text-slate-600">{{ .Phone }}</td>
        <td class="px-5 py-3 text-sm text-slate-600">{{ .Address }}</td>
        <td class="px-5 py-3 text-right">
          <div class="flex justify-end gap-2">
            <button class="rounded-lg border border-slate-200 px-3 py-1.5 text-xs font-semibold hover:bg-slate-50" hx-get="/customers/{{ .ID }}/edit" hx-target="#modal-content">Edit</button>
            <button class="rounded-lg border border-red-200 px-3 py-1.5 text-xs font-semibold text-red-600 hover:bg-red-50" hx-delete="/customers/{{ .ID }}" hx-target="#customers-table" hx-swap="outerHTML" hx-confirm="Hapus customer ini?">Hapus</button>
          </div>
        </td>
      </tr>
      {{ else }}
      <tr><td colspan="5" class="px-5 py-8 text-center text-sm text-slate-500">Belum ada customer.</td></tr>
      {{ end }}
    </tbody>
  </table>
</div>
{{ end }}

{{ define "customer-edit-form" }}
<form hx-post="/customers/{{ .Customer.ID }}/update" hx-target="#customers-table" hx-swap="outerHTML" class="grid gap-4" hx-on::after-request="if(event.detail.successful) closeEntityModal()">
  <label class="grid gap-1 text-sm font-medium">Nama <input name="name" required value="{{ .Customer.Name }}" class="rounded-lg border-slate-200 px-3 py-2 text-sm shadow-sm" /></label>
  <label class="grid gap-1 text-sm font-medium">Email <input name="email" type="email" required value="{{ .Customer.Email }}" class="rounded-lg border-slate-200 px-3 py-2 text-sm shadow-sm" /></label>
  <label class="grid gap-1 text-sm font-medium">Telepon <input name="phone" value="{{ .Customer.Phone }}" class="rounded-lg border-slate-200 px-3 py-2 text-sm shadow-sm" /></label>
  <label class="grid gap-1 text-sm font-medium">Alamat <input name="address" value="{{ .Customer.Address }}" class="rounded-lg border-slate-200 px-3 py-2 text-sm shadow-sm" /></label>
  <button class="rounded-lg bg-teal-600 px-4 py-2 text-sm font-semibold text-white hover:bg-teal-700">Update customer</button>
</form>
{{ end }}
