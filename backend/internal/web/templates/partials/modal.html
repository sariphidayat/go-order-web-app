{{ define "modal-shell" }}
<div id="entity-modal" class="hs-overlay pointer-events-none fixed start-0 top-0 z-[80] hidden size-full overflow-y-auto overflow-x-hidden" role="dialog" tabindex="-1">
  <div data-modal-panel class="m-3 mt-12 opacity-0 transition-all hs-overlay-open:mt-7 hs-overlay-open:opacity-100 sm:mx-auto sm:w-full sm:max-w-lg">
    <div class="pointer-events-auto rounded-xl border border-slate-200 bg-white shadow-xl">
      <div class="flex items-center justify-between border-b border-slate-200 px-4 py-3">
        <h3 class="font-semibold">Edit data</h3>
        <button type="button" class="inline-flex size-8 items-center justify-center rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50" onclick="closeEntityModal()">x</button>
      </div>
      <div id="modal-content" class="p-4"></div>
    </div>
  </div>
</div>
{{ end }}
