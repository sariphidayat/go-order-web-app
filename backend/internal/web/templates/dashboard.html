{{ define "content" }}
<div class="grid gap-5">
  <div class="grid gap-4 md:grid-cols-3">
    <div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
      <p class="text-sm font-medium text-slate-500">Customers</p>
      <p class="mt-2 text-3xl font-bold">{{ index .Stats "customers" }}</p>
    </div>
    <div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
      <p class="text-sm font-medium text-slate-500">Orders</p>
      <p class="mt-2 text-3xl font-bold">{{ index .Stats "orders" }}</p>
    </div>
    <div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
      <p class="text-sm font-medium text-slate-500">Tracking events</p>
      <p class="mt-2 text-3xl font-bold">{{ index .Stats "tracks" }}</p>
    </div>
  </div>
  <div class="rounded-xl border border-slate-200 bg-white shadow-sm">
    <div class="border-b border-slate-200 px-5 py-4">
      <h2 class="font-semibold">Order terbaru</h2>
    </div>
    {{ template "orders-table-readonly" . }}
  </div>
</div>
{{ end }}
