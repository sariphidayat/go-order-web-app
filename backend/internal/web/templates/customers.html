{{ define "content" }}
<div class="grid gap-5" x-data="{ open: true }">
  <div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
    <div class="mb-4 flex items-center justify-between gap-3">
      <h2 class="font-semibold">Tambah customer</h2>
      <button type="button" class="rounded-lg border border-slate-200 px-3 py-2 text-sm font-semibold" x-on:click="open = !open">Toggle form</button>
    </div>
    <form x-show="open" hx-post="/customers" hx-target="#customers-table" hx-swap="outerHTML" class="grid gap-4 md:grid-cols-2">
      <input name="name" required placeholder="Nama" class="rounded-lg border-slate-200 px-3 py-2 text-sm shadow-sm" />
      <input name="email" type="email" required placeholder="Email" class="rounded-lg border-slate-200 px-3 py-2 text-sm shadow-sm" />
      <input name="phone" placeholder="Telepon" class="rounded-lg border-slate-200 px-3 py-2 text-sm shadow-sm" />
      <input name="address" placeholder="Alamat" class="rounded-lg border-slate-200 px-3 py-2 text-sm shadow-sm" />
      <div class="md:col-span-2">
        <button class="rounded-lg bg-teal-600 px-4 py-2 text-sm font-semibold text-white hover:bg-teal-700">Simpan customer</button>
      </div>
    </form>
  </div>
  <div class="rounded-xl border border-slate-200 bg-white shadow-sm">
    <div class="border-b border-slate-200 px-5 py-4">
      <h2 class="font-semibold">Data customer</h2>
    </div>
    {{ template "customers-table" . }}
  </div>
  {{ template "modal-shell" . }}
</div>
{{ end }}
